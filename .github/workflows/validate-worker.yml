name: Validate Worker JavaScript

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - ".github/workflows/validate-worker.yml"
  pull_request:
    paths:
      - "worker.js"
      - ".github/workflows/validate-worker.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
